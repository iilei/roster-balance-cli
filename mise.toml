# note that artifactory may require a login.
# see https://mise.en.dev/configuration/settings.html#netrc_file
# machine <hostname>
#   login <username>
#   password <redacted>


[settings.url_replacements]
"regex:^https://github\\.com/iilei/rosterbalance-cli/releases/download/v([^/]+)/(.+)" = "http://localhost:8081/artifactory/example-repo-local/rosterbalance-cli/$1/$2"

[tools]
jfrog-cli = "latest"
# "github:iilei/rosterbalance-cli" = "0.0.0+pre-001"
go = "1.27.1"
prek = "latest"
rumdl = "latest"
golangci-lint = "latest"

[tasks.jf]
description = "Run JFrog CLI"
raw = true
raw_args = true
run = "jf"

[tasks.rosterbalance-cli]
description = "Run the mise-managed rosterbalance-cli CLI"
raw = true
raw_args = true
run = "rosterbalance-cli"

[tasks.rosterbalance-cli-help]
description = "Show rosterbalance-cli help"
run = "rosterbalance-cli --help"

[tasks.fmt]
description = "Format Go sources"
run = "golangci-lint fmt"

[tasks.lint]
description = "Run Go static analysis"
run = "golangci-lint run"

[tasks.test]
description = "Run Go tests"
run = "go test ./..."
