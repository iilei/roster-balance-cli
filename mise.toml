# note that artifactory may require a login.
# see https://mise.en.dev/configuration/settings.html#netrc_file
# machine <hostname>
#   login <username>
#   password <redacted>


[settings.url_replacements]
"regex:^https://github\\.com/iilei/rooster-balance-cli/releases/download/v([^/]+)/(.+)" = "http://localhost:8081/artifactory/example-repo-local/rooster-balance-cli/$1/$2"

[tools]
jfrog-cli = "latest"
"github:iilei/rooster-balance-cli" = "0.0.0+pre-001"
go = "1.25.0"
prek = "0.5.0"
rumdl = "0.2.62"
golangci-lint = "2.13.2"

[tasks.jf]
description = "Run JFrog CLI"
raw = true
raw_args = true
run = "jf"

[tasks.rooster-balance-cli]
description = "Run the mise-managed rooster-balance-cli CLI"
raw = true
raw_args = true
run = "rooster-balance-cli"

[tasks.rooster-balance-cli-help]
description = "Show rooster-balance-cli help"
run = "rooster-balance-cli --help"

[tasks.fmt]
description = "Format Go sources"
run = "golangci-lint fmt"

[tasks.lint]
description = "Run Go static analysis"
run = "golangci-lint run"

[tasks.test]
description = "Run Go tests"
run = "go test ./..."
