version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: rosterbalance-cli-linux
    main: ./cmd/rosterbalance-cli
    binary: rosterbalance-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"  # ARMv7
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

  - id: rosterbalance-cli-darwin
    main: ./cmd/rosterbalance-cli
    binary: rosterbalance-cli
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

  - id: rosterbalance-cli-windows
    main: ./cmd/rosterbalance-cli
    binary: rosterbalance-cli
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: unix-archives
    ids:
      - rosterbalance-cli-linux
      - rosterbalance-cli-darwin
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_
      {{- if and (eq .Os "darwin") (eq .Arch "all") -}}
      universal2
      {{- else if eq .Arch "amd64" -}}
      x86_64
      {{- else if eq .Arch "386" -}}
      i386
      {{- else -}}
      {{ .Arch }}
      {{- end -}}
      {{- if eq .Arch "arm" }}v{{ .Arm }}{{ end }}
    formats:
      - tar.gz
    files:
      - README.md
      - LICENSE

  - id: windows-archives
    ids:
      - rosterbalance-cli-windows
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - zip
    files:
      - README.md
      - LICENSE

universal_binaries:
  - id: rosterbalance-cli-darwin
    ids:
      - rosterbalance-cli-darwin
    replace: true

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: 'Bug fixes'
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999

signs:
  - cmd: gpg
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"
    artifacts: checksum
    output: true

release:
  prerelease: auto
  draft: false
  replace_existing_draft: true
  make_latest: true
  mode: replace
  header: |
    ## rosterbalance-cli {{ .Tag }} ({{ .Date }})

    Phonetic identifier generator - converts numbers to pronounceable identifiers.
  footer: |
    **Full Changelog**: https://github.com/iilei/rosterbalance-cli/compare/{{ .PreviousTag }}...{{ .Tag }}

    ## Installation

    ### Binary Download
    Download the appropriate binary for your platform from the assets below.

    ### Using Go
    ```bash
    go install github.com/iilei/rosterbalance-cli/cmd/rosterbalance-cli@{{ .Tag }}
    ```
